<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Calc | Free calculator tools</title><link rel="stylesheet" href="style.css"></head><body><header><strong>All Calc</strong><button id="theme">Toggle theme</button></header><main><h1>Everyday math, made simpler.</h1><p>Free, browser-based educational calculators. No account required.</p><section><h2>Scientific calculator</h2><label for="expr">Expression (angles in degrees)</label><input id="expr" placeholder="sin(30)+2^3" autocomplete="off"><output id="result" aria-live="polite">0</output><div id="keys"></div><button id="calculate">Calculate</button><button id="clear">Clear</button><h3>History</h3><ol id="history"></ol></section><section><h2>Percentage calculator</h2><label for="percent">Percentage</label><input id="percent" type="number" value="15"><label for="base">Of number</label><input id="base" type="number" value="200"><button id="pct">Calculate percentage</button><output id="pctout" aria-live="polite"></output></section><section><h2>Length converter</h2><label for="amount">Amount</label><input id="amount" type="number" value="1"><label for="from">From</label><select id="from"><option>m</option><option>km</option><option>cm</option><option>mm</option><option>in</option><option>ft</option><option>mi</option></select><label for="to">To</label><select id="to"><option>km</option><option>m</option><option>cm</option><option>mm</option><option>in</option><option>ft</option><option>mi</option></select><button id="convert">Convert</button><output id="conversion" aria-live="polite"></output></section><section><h2>Linear equation solver</h2><p>ax + b = c</p><label for="a">a</label><input id="a" type="number" value="2"><label for="b">b</label><input id="b" type="number" value="3"><label for="c">c</label><input id="c" type="number" value="7"><button id="solve">Solve</button><output id="solution" aria-live="polite"></output></section></main><footer><a href="https://github.com/Abduwr/all-calc">Open source on GitHub</a> · Educational use</footer><script type="module" src="app.js"></script></body></html>
